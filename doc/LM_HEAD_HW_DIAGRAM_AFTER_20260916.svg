<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="1280" height="1080" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text x="30" y="44" font-size="26" font-weight="bold" fill="#1b5e20">LM Head 优化后硬件计算示意（P2 目标架构）</text>
  <text x="30" y="72" font-size="15" fill="#33691e">128-bit 连续读 + 8 lanes 乘加 + 16 路交错累加 + 数据流重叠 · U=8 / K=16 / word 循环 II=1 @ 100 MHz</text>
  <text x="30" y="94" font-size="12" fill="#78909c">依据 doc/LM_HEAD_PERFORMANCE_ANALYSIS_20260916.md（§5 P1–P3、§6）绘制；图中时间为模型下限 / 工程目标，非实测</text>

  <!-- ===== 第一行：访存与供数 ===== -->
  <!-- PS DDR -->
  <rect x="30" y="150" width="210" height="150" rx="10" fill="#eceff4" stroke="#78909c" stroke-width="1.5"/>
  <text x="135" y="176" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238">PS DDR</text>
  <text x="45" y="202" font-size="11.5" fill="#37474f">W 151,936×896 FP16</text>
  <text x="45" y="220" font-size="11.5" fill="#37474f">259.66 MiB（常驻、复用）</text>
  <text x="45" y="244" font-size="11.5" fill="#37474f">hidden 1,792 B / history 18,992 B</text>
  <text x="45" y="262" font-size="11.5" fill="#37474f">raw logits 303,872 B（调试）</text>
  <text x="45" y="286" font-size="10.5" fill="#78909c">仅 hidden / history 每 token 更新</text>

  <!-- HP0 -->
  <rect x="280" y="185" width="130" height="80" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.5"/>
  <text x="345" y="212" font-size="13" font-weight="bold" text-anchor="middle" fill="#263238">HP0 128-bit</text>
  <text x="345" y="232" font-size="11.5" text-anchor="middle" fill="#37474f">@100 MHz</text>
  <text x="345" y="250" font-size="11.5" text-anchor="middle" fill="#37474f">峰值 1.6 GB/s</text>
  <line x1="240" y1="225" x2="280" y2="225" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="225" x2="450" y2="225" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- A 顺序 burst reader -->
  <rect x="450" y="150" width="240" height="150" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="465" y="176" font-size="14" font-weight="bold" fill="#1b5e20">A · 顺序 burst reader</text>
  <text x="465" y="200" font-size="11.5" fill="#33691e">每拍读 1×128-bit word = 8×FP16</text>
  <text x="465" y="218" font-size="11.5" fill="#33691e">16-bit slice 按位 bit-cast 为 half</text>
  <text x="465" y="242" font-size="11.5" fill="#33691e">burst len=16 · outstanding=16 起步</text>
  <text x="465" y="260" font-size="11.5" fill="#33691e">＞16 拍 burst 会被 HP 拆分</text>
  <text x="465" y="280" font-size="10.5" fill="#78909c">以实测有效 GB/s 为准</text>

  <!-- 乒乓双缓冲 -->
  <rect x="730" y="150" width="250" height="150" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="745" y="176" font-size="14" font-weight="bold" fill="#b26a00">乒乓 tile 双缓冲</text>
  <text x="745" y="200" font-size="11.5" fill="#795548">tile = 32 行 × 1,792 B = 57,344 B</text>
  <text x="745" y="218" font-size="11.5" fill="#795548">双缓冲合计 ≈ 112 KiB，合理分 bank</text>
  <text x="745" y="242" font-size="11.5" fill="#795548">读块 / 算块 重叠（DATAFLOW）</text>
  <text x="745" y="260" font-size="11.5" fill="#795548">行末归约与下一行点积重叠</text>
  <text x="745" y="282" font-size="10.5" fill="#8d8d8d">避免“读完整块→算完整块”串行</text>

  <!-- buffer -> B -->
  <line x1="855" y1="300" x2="855" y2="400" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="865" y="352" font-size="11" font-weight="bold" fill="#2e7d32">每拍 1 word 流式供数</text>

  <!-- hidden 通路 -->
  <polyline points="135,300 135,440 420,440" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="326" font-size="11" font-weight="bold" fill="#2e7d32">hidden 1,792 B / 行</text>
  <text x="150" y="342" font-size="11" fill="#2e7d32">cyclic 分区 ×8 → 8 banks</text>

  <!-- ===== 左列：P1 / 数值一致性 / P3 ===== -->
  <rect x="30" y="460" width="350" height="120" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="45" y="486" font-size="13.5" font-weight="bold" fill="#424242">P1 · 先行验证版（可选中间步）</text>
  <text x="45" y="508" font-size="11.5" fill="#616161">单 lane + partial[16] 交错累加，II=8 → II=1</text>
  <text x="45" y="526" font-size="11.5" fill="#616161">仅消除累加依赖，不动数据通路</text>
  <text x="45" y="548" font-size="11.5" font-weight="bold" fill="#2e7d32">理想下限 1.361 s；验收目标 1.5 ~ 2 s/次</text>

  <rect x="30" y="600" width="350" height="150" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="1.5"/>
  <text x="45" y="624" font-size="13.5" font-weight="bold" fill="#827717">数值一致性验收（§6）</text>
  <text x="45" y="646" font-size="11.5" fill="#5d4037">交错累加 / 归约树改变 FP32 求和顺序，</text>
  <text x="45" y="664" font-size="11.5" fill="#5d4037">不保证与旧实现逐位一致，必须对拍：</text>
  <text x="45" y="682" font-size="11.5" fill="#5d4037">raw logits 误差 / Top-5 / token / score</text>
  <text x="45" y="700" font-size="11.5" fill="#5d4037">FP16 平局保留较小 token ID</text>
  <text x="45" y="718" font-size="11.5" fill="#5d4037">（如 step7 的 100013 与 100048 同分）</text>
  <text x="45" y="738" font-size="10.5" fill="#8d8d8d">co-sim 覆盖 U=8/K=16、跨 tile、连续调用</text>

  <rect x="30" y="770" width="350" height="60" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="45" y="792" font-size="13" font-weight="bold" fill="#283593">P3 · 提频（结构稳定后）</text>
  <text x="45" y="812" font-size="11.5" fill="#3949ab">150/200 MHz：改系统时钟并验证实现时序 → 理想 0.085 s</text>

  <!-- ===== 第二行：B 计算核心 ===== -->
  <rect x="420" y="400" width="520" height="290" rx="12" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="440" y="428" font-size="15" font-weight="bold" fill="#1b5e20">B · 8 lanes 乘加 + FP32 交错累加（核心）</text>
  <rect x="790" y="412" width="130" height="22" rx="6" fill="#2e7d32"/>
  <text x="855" y="427" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">word 循环 II=1</text>

  <!-- 权重切片 -->
  <rect x="445" y="446" width="200" height="54" rx="8" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="545" y="467" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">128-bit word → 8×FP16</text>
  <text x="545" y="486" font-size="11" text-anchor="middle" fill="#33691e">各 16-bit slice 按位解释为 half</text>

  <!-- hidden banks -->
  <rect x="675" y="446" width="240" height="54" rx="8" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="795" y="467" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">hidden 缓存 8 banks</text>
  <text x="795" y="486" font-size="11" text-anchor="middle" fill="#33691e">cyclic partition=8 · 每拍供 8 half</text>

  <line x1="545" y1="500" x2="545" y2="514" stroke="#66bb6a" stroke-width="2"/>
  <line x1="795" y1="500" x2="795" y2="514" stroke="#66bb6a" stroke-width="2"/>
  <line x1="445" y1="514" x2="903" y2="514" stroke="#66bb6a" stroke-width="2"/>

  <!-- 8 个 lane -->
  <line x1="471" y1="514" x2="471" y2="530" stroke="#66bb6a" stroke-width="1.5"/>
  <line x1="529" y1="514" x2="529" y2="530" stroke="#66bb6a" stroke-width="1.5"/>
  <line x1="587" y1="514" x2="587" y2="530" stroke="#66bb6a" stroke-width="1.5"/>
  <line x1="645" y1="514" x2="645" y2="530" stroke="#66bb6a" stroke-width="1.5"/>
  <line x1="703" y1="514" x2="703" y2="530" stroke="#66bb6a" stroke-width="1.5"/>
  <line x1="761" y1="514" x2="761" y2="530" stroke="#66bb6a" stroke-width="1.5"/>
  <line x1="819" y1="514" x2="819" y2="530" stroke="#66bb6a" stroke-width="1.5"/>
  <line x1="877" y1="514" x2="877" y2="530" stroke="#66bb6a" stroke-width="1.5"/>

  <rect x="445" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="471" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L0</text>
  <text x="471" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>
  <rect x="503" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="529" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L1</text>
  <text x="529" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>
  <rect x="561" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="587" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L2</text>
  <text x="587" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>
  <rect x="619" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="645" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L3</text>
  <text x="645" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>
  <rect x="677" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="703" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L4</text>
  <text x="703" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>
  <rect x="735" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="761" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L5</text>
  <text x="761" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>
  <rect x="793" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="819" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L6</text>
  <text x="819" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>
  <rect x="851" y="530" width="52" height="44" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="877" y="549" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">L7</text>
  <text x="877" y="566" font-size="10" text-anchor="middle" fill="#33691e">FP16 ×</text>

  <line x1="471" y1="574" x2="471" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="529" y1="574" x2="529" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="587" y1="574" x2="587" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="645" y1="574" x2="645" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="703" y1="574" x2="703" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="761" y1="574" x2="761" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="819" y1="574" x2="819" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="877" y1="574" x2="877" y2="596" stroke="#546e7a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- partial -->
  <rect x="445" y="596" width="460" height="56" rx="8" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="675" y="617" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">partial[8][16] FP32 交错累加（完全分区）</text>
  <text x="675" y="637" font-size="10.5" text-anchor="middle" fill="#33691e">lane j 写 partial[j][i mod 16]：同一单元间隔 16 拍 ≥ 反馈延迟 → II=1</text>
  <text x="440" y="676" font-size="10.5" fill="#33691e">每行 896 half = 112 word · 每拍 lane j = word 第 j 个 half × bank j 的 hidden · 行末合并 128 个 FP32 partial</text>

  <!-- C 归约 -->
  <rect x="980" y="400" width="270" height="130" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="995" y="426" font-size="14" font-weight="bold" fill="#1b5e20">C · 流水归约树</text>
  <text x="995" y="450" font-size="11.5" fill="#33691e">128 个 FP32 partial → 1 个和</text>
  <text x="995" y="468" font-size="11.5" fill="#33691e">→ 转 FP16 raw logit</text>
  <text x="995" y="492" font-size="11.5" fill="#33691e">双组 partial / 流水归约树：</text>
  <text x="995" y="510" font-size="11.5" fill="#33691e">归约与下一行点积重叠</text>
  <line x1="940" y1="465" x2="980" y2="465" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- D policy -->
  <rect x="980" y="560" width="270" height="120" rx="10" fill="#f1f8e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="995" y="586" font-size="14" font-weight="bold" fill="#1b5e20">D · policy / argmax</text>
  <text x="995" y="610" font-size="11.5" fill="#33691e">（可选）penalty 处理</text>
  <text x="995" y="628" font-size="11.5" fill="#33691e">argmax：平局保留较小 token ID</text>
  <text x="995" y="652" font-size="11.5" fill="#33691e">生产仅输出 token / score；</text>
  <text x="995" y="668" font-size="11.5" fill="#33691e">调试时写回 raw logits → DDR</text>
  <line x1="1115" y1="530" x2="1115" y2="560" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 输出 -->
  <rect x="980" y="710" width="270" height="100" rx="10" fill="#eceff4" stroke="#78909c" stroke-width="1.5"/>
  <text x="1115" y="738" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#263238">PS / 千兆网 → 主机</text>
  <text x="1115" y="762" font-size="11.5" text-anchor="middle" fill="#37474f">token + score</text>
  <text x="1115" y="782" font-size="10.5" text-anchor="middle" fill="#78909c">raw logits 仅调试回传</text>
  <line x1="1115" y1="680" x2="1115" y2="710" stroke="#546e7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== 底部阶段对照表 ===== -->
  <rect x="30" y="850" width="1220" height="186" rx="8" fill="#fafafa" stroke="#b0bec5"/>
  <rect x="32" y="948" width="1216" height="26" fill="#e8f5e9"/>
  <text x="45" y="876" font-size="12.5" font-weight="bold" fill="#37474f">阶段</text>
  <text x="175" y="876" font-size="12.5" font-weight="bold" fill="#37474f">关键结构</text>
  <text x="705" y="876" font-size="12.5" font-weight="bold" fill="#37474f">时钟</text>
  <text x="830" y="876" font-size="12.5" font-weight="bold" fill="#37474f">理想计算下限</text>
  <text x="1005" y="876" font-size="12.5" font-weight="bold" fill="#37474f">完整调用目标</text>
  <line x1="30" y1="886" x2="1250" y2="886" stroke="#cfd8dc"/>
  <line x1="165" y1="850" x2="165" y2="1036" stroke="#eceff1"/>
  <line x1="695" y1="850" x2="695" y2="1036" stroke="#eceff1"/>
  <line x1="820" y1="850" x2="820" y2="1036" stroke="#eceff1"/>
  <line x1="995" y1="850" x2="995" y2="1036" stroke="#eceff1"/>

  <text x="45" y="910" font-size="12" fill="#37474f">历史基线（优化前）</text>
  <text x="175" y="910" font-size="12" fill="#37474f">单 lane · 单 FP32 累加器 · II=8 · vocab_loop 顺序执行</text>
  <text x="705" y="910" font-size="12" fill="#37474f">100 MHz</text>
  <text x="830" y="910" font-size="12" fill="#c62828">≈ 10.979 s（综合）</text>
  <text x="1005" y="910" font-size="12" fill="#37474f">实测 RTT 11.090 s</text>

  <text x="45" y="936" font-size="12" fill="#37474f">P1</text>
  <text x="175" y="936" font-size="12" fill="#37474f">单 lane + K=16 交错累加 · II=1</text>
  <text x="705" y="936" font-size="12" fill="#37474f">100 MHz</text>
  <text x="830" y="936" font-size="12" fill="#37474f">1.361 s</text>
  <text x="1005" y="936" font-size="12" fill="#37474f">1.5 ~ 2 s</text>

  <text x="45" y="962" font-size="12" font-weight="bold" fill="#1b5e20">P2（本图）</text>
  <text x="175" y="962" font-size="12" fill="#1b5e20">128-bit 读 + 8 lanes + K=16 + DATAFLOW 重叠</text>
  <text x="705" y="962" font-size="12" fill="#37474f">100 MHz</text>
  <text x="830" y="962" font-size="12" font-weight="bold" fill="#1b5e20">0.170 s</text>
  <text x="1005" y="962" font-size="12" fill="#37474f">0.3 ~ 0.6 s</text>

  <text x="45" y="988" font-size="12" fill="#37474f">P3</text>
  <text x="175" y="988" font-size="12" fill="#37474f">P2 结构提频（需实现时序 / 带宽确认）</text>
  <text x="705" y="988" font-size="12" fill="#37474f">200 MHz</text>
  <text x="830" y="988" font-size="12" fill="#37474f">0.085 s</text>
  <text x="1005" y="988" font-size="12" fill="#37474f">0.15 ~ 0.30 s</text>

  <text x="45" y="1022" font-size="10.5" fill="#78909c">均为模型下限 / 工程目标，非新实测；受同频单个 HP0 带宽下限约束（如有效 0.8 GB/s 时仅读权重即 ≥ 340 ms）。</text>
</svg>
